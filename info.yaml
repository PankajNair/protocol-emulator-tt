# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # TODO: finalize title
  author:       "Pankaj Nair"
  discord:      ""      # TODO: fill in your discord username (optional)
  description:  "Programmable protocol emulator: firmware-driven UART/SPI/I2C via a tiny pin-oriented CPU"
  language:     "Verilog"
  clock_hz:     50000000 # 50MHz -- TT's documented floor ("at least 50MHz",
  # RP2040-generated), and already what src/config.json's CLOCK_PERIOD=20 (20ns)
  # has assumed in every flow-validation run so far. See docs/protocol_timing.md.

  # Competition rule: max 6x4 tiles. Confirmed valid against the actual
  # source of truth (TinyTapeout/tt-support-tools tech/ihp-sg13g2/tile_sizes.yaml,
  # not this template's stale comment below, which predates 3x4/4x4/5x4/6x4/8x4
  # support): 6x4 -> 1289.28 x 710.64 um (~0.92mm^2 placed, vs. ~0.7mm^2 naive
  # 24-tile estimate -- TT adds margin on larger multi-tile footprints).
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2 (template comment is stale -- 3x4/4x4/5x4/6x4/8x4 also valid per tt-support-tools)

  # Must be unique -- includes github username per TT convention.
  top_module:  "tt_um_pankajnair_protocol_emulator"

  # isa_defs.v first, deliberately: core.v/cycle_counter.v/pin_ctrl.v
  # use its `define`s with no `include` (portability -- some synth
  # flows don't share test/Makefile's -I search path), relying instead
  # on it being compiled before them in this same list, within one
  # compile invocation. top.v last, since it depends on everything
  # else. Kept in sync with test/Makefile's PROJECT_SOURCES.
  source_files:
    - "cpu/isa_defs.v"
    - "cpu/core.v"
    - "cpu/regfile.v"
    - "io/cycle_counter.v"
    - "io/pin_ctrl.v"
    - "mem/mem.v"
    - "top.v"

# Real pinout, locked (docs/architecture.md Pin map is the source of
# truth -- this mirrors it, not the other way around). Replaces the
# flow-validation placeholder (trivial passthrough adder) this section
# described before the ISA/pin map were designed.
pinout:
  # Host DATA-IN bus -- host writes a byte, firmware's IN reads it.
  ui[0]: "DATA_IN[0]"
  ui[1]: "DATA_IN[1]"
  ui[2]: "DATA_IN[2]"
  ui[3]: "DATA_IN[3]"
  ui[4]: "DATA_IN[4]"
  ui[5]: "DATA_IN[5]"
  ui[6]: "DATA_IN[6]"
  ui[7]: "DATA_IN[7]"

  # Host DATA-OUT bus -- firmware's OUT drives a byte, host reads it.
  uo[0]: "DATA_OUT[0]"
  uo[1]: "DATA_OUT[1]"
  uo[2]: "DATA_OUT[2]"
  uo[3]: "DATA_OUT[3]"
  uo[4]: "DATA_OUT[4]"
  uo[5]: "DATA_OUT[5]"
  uo[6]: "DATA_OUT[6]"
  uo[7]: "DATA_OUT[7]"

  # uio[3:0]/uio[7]: generic protocol pin bus, pin_index 0-4 -- role is
  # a firmware convention (UART TX/RX, SPI MOSI/MISO/SCLK/CS, I2C
  # SDA/SCL all reuse the same 5 physical pins). uio[4:6]: fixed
  # host-handshake roles, uio[6] mode-dependent (START during LOAD,
  # HOST_ERROR once running).
  uio[0]: "PROTO[0]"
  uio[1]: "PROTO[1]"
  uio[2]: "PROTO[2]"
  uio[3]: "PROTO[3]"
  uio[4]: "HOST_GO"
  uio[5]: "HOST_STATUS"
  uio[6]: "START / HOST_ERROR"
  uio[7]: "PROTO[4]"

# Do not change!
yaml_version: 6
