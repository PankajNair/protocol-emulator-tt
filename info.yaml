# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # TODO: finalize title
  author:       ""      # TODO: fill in your name
  discord:      ""      # TODO: fill in your discord username (optional)
  description:  "Programmable protocol emulator: firmware-driven UART/SPI/I2C via a tiny pin-oriented CPU"
  language:     "Verilog"
  clock_hz:     0       # TODO: set once baud-rate/timing budget is worked out

  # TODO: competition brief says max 6x4 tiles (~0.7mm^2), but this template's
  # valid-value list doesn't include 6x4 -- confirm actual max for this
  # shuttle on TT Discord/docs before finalizing. Using 6x2 as a safe
  # placeholder in the meantime.
  tiles: "6x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Must be unique -- includes github username per TT convention.
  top_module:  "tt_um_pankajnair_protocol_emulator"

  # Only top.v wired in for now -- cpu/io/mem submodules aren't instantiated
  # yet (see TODOs in src/cpu, src/io, src/mem). Add them here as they're
  # wired into top.v, and update test/Makefile PROJECT_SOURCES to match.
  source_files:
    - "top.v"

