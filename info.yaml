# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # TODO: finalize title
  author:       "Pankaj Nair"
  discord:      ""      # TODO: fill in your discord username (optional)
  description:  "Programmable protocol emulator: firmware-driven UART/SPI/I2C via a tiny pin-oriented CPU"
  language:     "Verilog"
  clock_hz:     0       # TODO: set once baud-rate/timing budget is worked out

  # Competition rule: max 6x4 tiles. Confirmed valid against the actual
  # source of truth (TinyTapeout/tt-support-tools tech/ihp-sg13g2/tile_sizes.yaml,
  # not this template's stale comment below, which predates 3x4/4x4/5x4/6x4/8x4
  # support): 6x4 -> 1289.28 x 710.64 um (~0.92mm^2 placed, vs. ~0.7mm^2 naive
  # 24-tile estimate -- TT adds margin on larger multi-tile footprints).
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2 (template comment is stale -- 3x4/4x4/5x4/6x4/8x4 also valid per tt-support-tools)

  # Must be unique -- includes github username per TT convention.
  top_module:  "tt_um_pankajnair_protocol_emulator"

  # FLOW-VALIDATION ONLY: top.v temporarily instantiates the IHP SRAM hard
  # macro (see src/config.json MACROS block) instead of cpu/io/mem, to
  # measure real integration cost before the ISA is locked. The blackbox
  # netlist below is required alongside it for TT's own port/hierarchy
  # checks (see MACROS.nl in src/config.json for the synthesis-time copy).
  # Revert both this list and top.v once the validation run lands.
  source_files:
    - "top.v"
    - "RM_IHPSG13_1P_1024x8_c2_bm_bist.v"

# FLOW-VALIDATION PLACEHOLDER -- describes the SRAM-macro validation wiring
# in src/top.v (address/wen/bank_select on ui_in, data on uio_in/uo_out),
# used only to get real synth/P&R/GDS numbers for the SRAM macro on CMOS5L
# before the ISA is locked. NOT the real protocol emulator's pinout --
# expect this whole section to be rewritten once the sequencer ISA + pin
# mapping (docs/architecture.md) is designed.
pinout:
  # Inputs
  ui[0]: "addr[0]"
  ui[1]: "addr[1]"
  ui[2]: "addr[2]"
  ui[3]: "addr[3]"
  ui[4]: "addr[4]"
  ui[5]: "addr[5]"
  ui[6]: "bank_sel"
  ui[7]: "wen"

  # Outputs
  uo[0]: "dout[0]"
  uo[1]: "dout[1]"
  uo[2]: "dout[2]"
  uo[3]: "dout[3]"
  uo[4]: "dout[4]"
  uo[5]: "dout[5]"
  uo[6]: "dout[6]"
  uo[7]: "dout[7]"

  # Bidirectional pins
  uio[0]: "din[0]/addr[6]"
  uio[1]: "din[1]/addr[7]"
  uio[2]: "din[2]/addr[8]"
  uio[3]: "din[3]/addr[9]"
  uio[4]: "din[4]"
  uio[5]: "din[5]"
  uio[6]: "din[6]"
  uio[7]: "din[7]"

# Do not change!
yaml_version: 6
