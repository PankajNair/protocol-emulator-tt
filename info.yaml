# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # TODO: finalize title
  author:       "Pankaj Nair"
  discord:      ""      # TODO: fill in your discord username (optional)
  description:  "Programmable protocol emulator: firmware-driven UART/SPI/I2C via a tiny pin-oriented CPU"
  language:     "Verilog"
  clock_hz:     0       # TODO: set once baud-rate/timing budget is worked out

  # Competition rule: max 6x4 tiles. Confirmed valid against the actual
  # source of truth (TinyTapeout/tt-support-tools tech/ihp-sg13g2/tile_sizes.yaml,
  # not this template's stale comment below, which predates 3x4/4x4/5x4/6x4/8x4
  # support): 6x4 -> 1289.28 x 710.64 um (~0.92mm^2 placed, vs. ~0.7mm^2 naive
  # 24-tile estimate -- TT adds margin on larger multi-tile footprints).
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2 (template comment is stale -- 3x4/4x4/5x4/6x4/8x4 also valid per tt-support-tools)

  # Must be unique -- includes github username per TT convention.
  top_module:  "tt_um_pankajnair_protocol_emulator"

  # Only top.v wired in for now -- cpu/io/mem submodules aren't instantiated
  # yet (see TODOs in src/cpu, src/io, src/mem). Add them here as they're
  # wired into top.v, and update test/Makefile PROJECT_SOURCES to match.
  source_files:
    - "top.v"

# FLOW-VALIDATION PLACEHOLDER -- describes the trivial passthrough adder in
# src/top.v (uo_out = ui_in + uio_in), used only to get real synth/P&R/GDS
# numbers on CMOS5L before the ISA is locked. NOT the real protocol
# emulator's pinout -- expect this whole section to be rewritten once the
# sequencer ISA + pin mapping (docs/architecture.md) is designed.
pinout:
  # Inputs
  ui[0]: "A[0]"
  ui[1]: "A[1]"
  ui[2]: "A[2]"
  ui[3]: "A[3]"
  ui[4]: "A[4]"
  ui[5]: "A[5]"
  ui[6]: "A[6]"
  ui[7]: "A[7]"

  # Outputs
  uo[0]: "SUM[0]"
  uo[1]: "SUM[1]"
  uo[2]: "SUM[2]"
  uo[3]: "SUM[3]"
  uo[4]: "SUM[4]"
  uo[5]: "SUM[5]"
  uo[6]: "SUM[6]"
  uo[7]: "SUM[7]"

  # Bidirectional pins
  uio[0]: "B[0]"
  uio[1]: "B[1]"
  uio[2]: "B[2]"
  uio[3]: "B[3]"
  uio[4]: "B[4]"
  uio[5]: "B[5]"
  uio[6]: "B[6]"
  uio[7]: "B[7]"

# Do not change!
yaml_version: 6
